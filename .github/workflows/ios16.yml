name: iOS 16 compatibility
on:
  workflow_dispatch:
  push:
    branches: [ios16-compat, ios16-hub-profiles, ios16-hub-dashboard]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4 (no iOS 26 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iOS 16 device application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build -project WB2API.xcodeproj -scheme WB2API -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CODE_SIGN_ENTITLEMENTS='' | tee build.log | tail -50
      - name: Package unsigned build for signing
        run: |
          mkdir -p package/Payload
          cp -R .build/Build/Products/Release-iphoneos/WB2API.app package/Payload/
          cd package
          zip -qry WB2API-ios16-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WB2API-ios16-unsigned
          path: package/WB2API-ios16-unsigned.ipa
      - name: Run unit tests on available simulator
        shell: bash
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for ds in d["devices"].values() for x in ds if "iPhone" in x["name"]))')
          xcodebuild test -project WB2API.xcodeproj -scheme WB2API -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath .build-test -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee tests.log | tail -60
      - name: Export fixture UI snapshots
        if: always()
        continue-on-error: true
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > test-summary.json
          xcrun xcresulttool get test-results tests --path TestResults.xcresult > test-results.json
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ui-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: ui-snapshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            build.log
            tests.log
            test-summary.json
            test-results.json
          if-no-files-found: ignore
